
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">

    <title>Contact Me</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">

    <link href="css/laptop.css" rel="stylesheet" type="text/css"
    media="only screen and (min-width:961px)">

    <link href="css/tablet.css" rel="stylesheet" type="text/css"
    media="only screen and (min-width:481px) and (max-width:960px)">

    <link href="css/mobile.css" rel="stylesheet" type="text/css"
    media="only screen and (max-width:480px)">
</head>

<body>

    <!-- Website header -->
    <header>
        <h1>Ammar Syed Portfolio</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <!-- Contact page content -->
    <main>

        <section class="contact-box">

            <h2>Contact Me</h2>

            <p>
                Have a question or want to connect?
                Send me a message below.
            </p>

            <!-- Contact form -->
            <form action="mailto:ammar.syed1@ontariotechu.net"
                  method="post"
                  enctype="text/plain"
                  name="form">

                <p>
                    <label for="name">Name</label>
                    <input type="text" id="name"
                           name="name" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           name="email" required>
                </p>

                <p>
                    <label for="phone">Cell No.</label>
                    <input type="tel" id="phone"
                           name="phone" required>
                </p>

                <p>
                    <label for="comments">Comments</label>
                    <textarea id="comments" name="comments"
                              rows="5" required></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit">
                </p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Contact: ammar.syed1@ontariotechu.net</p>
        <p>&copy; 2026 Ammar Syed</p>
    </footer>

</body>
</html>
